<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>TS Template — Demo</title>
    <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
<header class="site-header">
    <nav class="nav">
        <a href="#top" class="logo">MySite</a>
        <button id="openModalBtn" class="btn">Відкрити модалку</button>
    </nav>
    <h1>TypeScript + GitHub Pages</h1>
    <p class="muted">Скролль трохи униз, щоб побачити анімації і дані з API</p>
</header>

<main>
    <section class="cards" id="cards">
        <!-- Сюди прилетять пости з JSONPlaceholder -->
    </section>

<footer class="site-footer">

        <p>Ця модалка відкривається по кліку та закривається по кліку/ESC/бекдропу.</p>
    </div>

<!-- Підключаємо скомпільований JS -->
<script type="module" src="./assets/main.js"></script>
